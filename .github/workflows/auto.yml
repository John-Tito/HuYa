name: 虎牙虎粮自动发放

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      rooms:
        description: '房间号, 逗号分隔'
        required: false
        default: ''

jobs:
  send-hl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: huya-huliang
      cancel-in-progress: false
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 Python 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 包
        run: pip install -r requirements.txt

      - name: 安装 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: PRE:恢复登录态缓存(仅自动运行)
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .huya_cookie
          key: huya-cookie-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            huya-cookie-

      - name: PRE:检查登录态缓存
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_COOKIES: ${{ secrets.HUYA_COOKIES }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$HUYA_COOKIE" ] && [ -z "$HUYA_COOKIES" ]; then
              echo "❌ 手动运行必须配置 HUYA_COOKIE 或 HUYA_COOKIES"
              exit 1
            fi
          else
            if [ -z "$HUYA_COOKIE" ] && [ -z "$HUYA_COOKIES" ] && ! ls .huya_cookie/*.txt >/dev/null 2>&1; then
              echo "❌ 自动运行:未配置 Cookie, 且缓存中没有可用登录态"
              exit 1
            fi
          fi

      - name: PRE:获取房间号
        id: get-rooms
        env:
          INPUT_ROOMS: ${{ github.event.inputs.rooms }}
          SECRET_ROOMS: ${{ secrets.HUYA_ROOMS }}
        run: |
          ROOMS="$INPUT_ROOMS"
          if [ -z "$ROOMS" ]; then
            ROOMS="$SECRET_ROOMS"
          fi
          if [ -z "$ROOMS" ]; then
            echo "❌ 未配置 HUYA_ROOMS"
            exit 1
          fi
          {
            echo 'rooms<<EOF'
            echo "$ROOMS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 运行虎粮发放
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_COOKIES: ${{ secrets.HUYA_COOKIES }}
          HUYA_ROOMS: ${{ steps.get-rooms.outputs.rooms }}
          SEND_KEY: ${{ secrets.SEND_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p .huya_cookie

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手动运行:强制使用 Secrets 里的 Cookie, 忽略缓存文件"
            rm -f .huya_cookie/*.txt
          fi

          python main.py
          echo "✅ 虎粮发放完成"

      - name: POST:检查登录态缓存
        id: check-cookie
        if: always() # 即使前面失败也要检查
        run: |
          if find .huya_cookie -name "*.txt" -type f | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: POST:保存登录态缓存
        if: always() && steps.check-cookie.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: .huya_cookie
          key: huya-cookie-${{ github.run_id }}-${{ github.run_attempt }}